<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" /><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" /><meta http-equiv="Pragma" content="no-cache" /><title>Luxury Hotel Booking | Elite Stays</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap'); body { font-family: 'Inter', sans-serif; } h1, h2, h3 { font-family: 'Playfair Display', serif; }</style></head><body class="bg-[#FDFBF7] text-[#2D2926] min-h-screen"><div class="max-w-7xl mx-auto p-4 md:p-8"><header class="flex flex-col md:flex-row justify-between items-center mb-12 border-b border-[#D4AF37]/20 pb-6"><h1 class="text-4xl font-bold text-[#2D2926]">ELITE STAYS</h1><nav class="flex gap-6 text-sm uppercase tracking-widest mt-4 md:mt-0"><span>Properties</span><span>Reservations</span><span>Concierge</span></nav></header><main class="grid grid-cols-1 md:grid-cols-12 gap-8"><section class="md:col-span-8"><div class="bg-white p-8 rounded-sm shadow-sm border border-[#E5E5E5]"><h2 class="text-2xl mb-6">Available Luxury Suites</h2><div id="hotel-list" class="space-y-4"><div class="p-4 border border-[#D4AF37]/30 flex justify-between items-center"><div><h3 class="font-bold">The Royal Penthouse</h3><p class="text-sm text-gray-500">$1,200 / night</p></div><button class="px-6 py-2 bg-[#2D2926] text-[#D4AF37] hover:bg-[#3D3936] transition-all">Book Now</button></div></div></div></section><section class="md:col-span-4 space-y-8"><div class="bg-[#2D2926] p-8 text-[#FDFBF7]"><h2 class="text-xl mb-4 text-[#D4AF37]">Reservation Wizard</h2><div class="space-y-4"><input type="date" class="w-full p-3 bg-transparent border border-[#D4AF37]/50 text-white" /><button onclick="processBooking()" class="w-full py-4 bg-[#D4AF37] text-[#2D2926] font-bold hover:bg-[#C5A030] transition-all">Secure Booking</button></div></div><div class="p-6 border border-[#E5E5E5]"><h2 class="text-lg mb-4">System Status</h2><div id="status-badge" class="inline-flex items-center gap-2 px-4 py-2 bg-[#FDFBF7] border border-[#D4AF37] text-[#D4AF37]"><span>●</span> Operational (Standby Demo)</div></div></section></main></div><script>async function processBooking() { alert('Redirecting to secure payment gateway...'); } async function checkHealth() { try { const res = await fetch('/api/v1/hotels'); if(!res.ok) throw new Error(); } catch(e) { document.getElementById('status-badge').innerHTML = '<span>●</span> Operational (Standby Demo)'; } } checkHealth();</script></body></html>
